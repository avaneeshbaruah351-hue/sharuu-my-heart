<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharuu Baruah ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
overflow:hidden;
color:white;
background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#ff2e63);
background-size:400% 400%;
animation:gradientBG 15s ease infinite;
transition:background 3s ease;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* STARS */
#stars{position:fixed;top:0;left:0;z-index:-1;}

/* INTRO */
#intro{
position:fixed;width:100%;height:100vh;
background:black;display:flex;
justify-content:center;align-items:center;
flex-direction:column;z-index:100;
}

#startBtn{
padding:15px 30px;border:none;border-radius:30px;
background:#ff2e63;color:white;font-size:18px;
cursor:pointer;box-shadow:0 0 20px #ff2e63;
}

/* SLIDES */
.slide{
position:absolute;width:100%;height:100vh;
display:flex;justify-content:center;align-items:center;
text-align:center;padding:30px;
opacity:0;transition:2s;
}
.active{opacity:1;}

h1{font-size:clamp(28px,6vw,60px);}
p{margin-top:20px;font-size:clamp(18px,4vw,26px);max-width:800px;}

/* COUNTDOWN */
#countdown{font-size:clamp(25px,5vw,40px);margin-top:20px;}

/* SKY TEXT */
#skyText{
font-size:clamp(40px,8vw,70px);
color:#ff2e63;
text-shadow:0 0 20px #ff2e63,0 0 50px #ff0066;
}

/* 3D RING */
#ring3d{
font-size:110px;
display:none;
animation:rotate 4s linear infinite;
}
@keyframes rotate{
0%{transform:rotateY(0deg);}
100%{transform:rotateY(360deg);}
}

/* POPUP */
.popup{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:white;color:black;
padding:30px;border-radius:20px;
display:none;z-index:200;
text-align:center;width:90%;max-width:350px;
}
.popup button{
margin-top:20px;padding:10px 25px;
border:none;background:#ff2e63;
color:white;border-radius:20px;
cursor:pointer;
}

/* SECRET MESSAGE */
#secret{
position:fixed;
bottom:20px;
width:100%;
text-align:center;
font-size:18px;
opacity:0;
transition:2s;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<canvas id="fireworks"></canvas>

<div id="intro">
<h1 style="color:#ff2e63;">Sharuu ❤️</h1>
<button id="startBtn">Tap To Start Love Story 💖</button>
</div>

<audio id="bgMusic" loop>
<source src="perfect.mp3" type="audio/mpeg">
</audio>

<audio id="heartbeat" loop>
<source src="heartbeat.mp3" type="audio/mpeg">
</audio>

<!-- Slide 1 -->
<div class="slide active">
<div>
<h1>Sharuu Baruah (Jaanu)</h1>
<p>You are my destiny, my forever 💕</p>
</div>
</div>

<!-- Slide 2 COUNTDOWN -->
<div class="slide">
<div>
<h1>Counting Down To Our Love 💖</h1>
<div id="countdown"></div>
</div>
</div>

<!-- Slide 3 EMOTIONAL -->
<div class="slide">
<div>
<h1>My Heart Says...</h1>
<p id="typing"></p>
</div>
</div>

<!-- Slide 4 SKY -->
<div class="slide">
<div>
<h1 id="skyText"></h1>
</div>
</div>

<!-- Slide 5 RING -->
<div class="slide">
<div id="ring3d">💎💍</div>
</div>
</div>

<div class="popup" id="proposal">
<h2>Will You Be Mine Forever? 💍</h2>
<button onclick="yesClicked()">Yes ❤️</button>
</div>

<div id="secret">💌 tumi mur jaan hoi bujisaa tuu ❤️</div>

<script>
let slides=document.querySelectorAll(".slide");
let index=0;

function nextSlide(){
slides[index].classList.remove("active");
index=(index+1)%slides.length;
slides[index].classList.add("active");

if(index===4){
setTimeout(()=>{
document.getElementById("proposal").style.display="block";
startFireworks();
},3000);
}
}

function startLove(){
document.getElementById("intro").style.display="none";
document.getElementById("bgMusic").play().catch(()=>{});
document.getElementById("heartbeat").play().catch(()=>{});
setInterval(nextSlide,9000);
startTyping();
startSkyWriting();
}

document.getElementById("startBtn").addEventListener("click",startLove);

/* COUNTDOWN TO 12 NOVEMBER 2025 */
const targetDate=new Date("2025-11-12");
function updateCountdown(){
const now=new Date();
const diff=targetDate-now;
const days=Math.floor(diff/(1000*60*60*24));
document.getElementById("countdown").innerText=days+" Days To Our Forever ❤️";
}
setInterval(updateCountdown,1000);

/* TYPING */
const text="From the first moment I saw you, my world became brighter. You are my peace, my strength, my forever. ❤️";
let i=0;
function startTyping(){
let typing=setInterval(()=>{
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
}else clearInterval(typing);
},70);
}

/* SKY WRITING */
function startSkyWriting(){
let text2="I Love You Sharuu ❤️";
let j=0;
let interval=setInterval(()=>{
if(j<text2.length){
document.getElementById("skyText").innerHTML+=text2.charAt(j);
j++;
}else clearInterval(interval);
},120);
}

/* STARS */
const starCanvas=document.getElementById("stars");
const starCtx=starCanvas.getContext("2d");
starCanvas.width=window.innerWidth;
starCanvas.height=window.innerHeight;
let stars=[];
for(let i=0;i<200;i++){
stars.push({x:Math.random()*starCanvas.width,y:Math.random()*starCanvas.height,size:Math.random()*2});
}
function animateStars(){
starCtx.clearRect(0,0,starCanvas.width,starCanvas.height);
starCtx.fillStyle="white";
stars.forEach(s=>{
starCtx.fillRect(s.x,s.y,s.size,s.size);
s.y+=0.2;
if(s.y>starCanvas.height)s.y=0;
});
requestAnimationFrame(animateStars);
}
animateStars();

/* FIREWORKS */
const fireCanvas=document.getElementById("fireworks");
const fireCtx=fireCanvas.getContext("2d");
fireCanvas.width=window.innerWidth;
fireCanvas.height=window.innerHeight;

function startFireworks(){
for(let i=0;i<150;i++){
fireCtx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
fireCtx.beginPath();
fireCtx.arc(Math.random()*fireCanvas.width,
Math.random()*fireCanvas.height/2,3,0,Math.PI*2);
fireCtx.fill();
}
}

function yesClicked(){
document.getElementById("proposal").style.display="none";
document.getElementById("ring3d").style.display="block";
document.getElementById("secret").style.opacity="1";
}
</script>

</body>
</html>
